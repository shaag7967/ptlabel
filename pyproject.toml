[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ptlabel"
dynamic = ["version"]
description = "Etiketten-Editor und Druck für den Brother PT-P750W (WLAN)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "shaag7967" }]
keywords = ["brother", "p-touch", "pt-p750w", "label", "label printer", "etiketten"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: German",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
]
dependencies = [
    "pillow>=10.1",
    "segno>=1.5",
    "python-barcode>=0.15",
    "PySide6-Essentials>=6.8",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.scripts]
ptlabel = "ptlabel.cli:main"

[project.gui-scripts]
ptlabel-gui = "ptlabel.gui:run"

[tool.setuptools.dynamic]
version = { attr = "ptlabel.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
